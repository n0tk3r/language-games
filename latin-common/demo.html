<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Latin games: the shared shell (demo)</title>
<meta name="theme-color" content="#070d1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b3202a'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e2a93c' stroke-width='6'/%3E%3C/svg%3E">
<!-- the same order as a game's index.html; the players screens are Case Detective's (js/players.js), this is their look -->
<link rel="stylesheet" href="../case-detective/css/players.css">
<link rel="stylesheet" href="css/common.css">
<style>
  /* the demo's own bits */
  .demo-sec { display: flex; flex-direction: column; gap: 10px; }
  .demo-sec + .demo-sec { margin-top: 8px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .demo-row .btn { flex: 1 1 140px; }
  .demo-moods { display: flex; flex-wrap: wrap; gap: 8px; }
  .demo-moods .btn { flex: 1 1 88px; }
  .demo-pre { margin: 6px 0 0; padding: 10px; overflow: auto; max-height: 220px; border-radius: 10px; background: rgba(255, 255, 255, .6); color: var(--ink); font: 600 13px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .demo-q { font: 600 18px/1.3 var(--f-ui); }
  .demo-q b { font-family: var(--f-serif); font-size: 1.15em; }
  .demo-mode { display: flex; flex-wrap: wrap; gap: 6px; }
  .demo-mode .btn { flex: 1 1 90px; }
  .demo-mode .btn[aria-pressed="true"] { background: var(--brass-grad); color: var(--brass-ink); border-color: #7a4e10; box-shadow: 0 3px 0 #7a4e10; }
  .demo-res { min-height: 1.4em; font-weight: 800; }
</style>
</head>
<body>
<noscript><p class="noscript">This page needs JavaScript. Please turn it on and reload.</p></noscript>

<script src="js/words.js"></script>
<script src="js/charts.js"></script>
<script src="../case-detective/js/courses.js"></script>
<script src="../case-detective/js/players.js"></script>
<script src="js/players-fallback.js"></script>
<script src="js/players-words.js"></script>
<script src="../case-detective/js/detective.js"></script>
<script src="../case-detective/js/sfx.js"></script>
<script src="../case-detective/js/music.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  "use strict";
  var S = window.LatinShell, W = window.LATIN_WORDS || { chapters: {} };
  var LOGO = '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#e2a93c" stroke-width="2.2" stroke-linecap="round"><path d="M16 28C8 26 4 19 5 10"/><path d="M16 28c8-2 12-9 11-18"/></g>' +
    '<g fill="#e2a93c"><ellipse cx="5.2" cy="13" rx="1.8" ry="3.2" transform="rotate(-20 5.2 13)"/><ellipse cx="6.8" cy="19" rx="1.8" ry="3.2" transform="rotate(-45 6.8 19)"/><ellipse cx="10.5" cy="24" rx="1.8" ry="3.2" transform="rotate(-70 10.5 24)"/>' +
    '<ellipse cx="26.8" cy="13" rx="1.8" ry="3.2" transform="rotate(20 26.8 13)"/><ellipse cx="25.2" cy="19" rx="1.8" ry="3.2" transform="rotate(45 25.2 19)"/><ellipse cx="21.5" cy="24" rx="1.8" ry="3.2" transform="rotate(70 21.5 24)"/></g><circle cx="16" cy="12" r="4.2" fill="#b3202a" stroke="#ffe39a" stroke-width="1.4"/></svg>';

  function readyChapters() {
    var out = {};
    Object.keys(W.chapters || {}).forEach(function (k) { if (W.chapters[k].ready) { out[k] = true; } });
    return out;
  }

  var shell = S.mount({
    gamesHref: false,                                  /* the demo keeps the players screens on its own page */
    id: "demo",
    title: "Shell demo",
    sub: "Wheelock’s Latin · shared parts",
    logo: LOGO,
    onHome: function () { home(); },
    onSettings: function () { settings(); },
    filesIn: function () { return readyChapters(); },
    onPlayer: function (p, how) {
      home();
      if (!p) { shell.say("No player list on this page.", "think"); return; }
      var first = { added: "Welcome, <b>" + S.esc(p.name) + "</b>!", chapter: "Chapter " + p.chapter + " it is.", update: "Your chapter changed: now chapter " + p.chapter + "." }[how] || "Welcome back, <b>" + S.esc(p.name) + "</b>!";
      shell.say([first, "This page shows the parts the two games share.", "Tap the arrow, or the bubble, for my next line."], ["wave", "point", "idle"]);
    }
  });
  window.demoShell = shell;

  var progress = S.store("latinDemo.v1");

  function home() {
    var p = shell.player(), d = shell.desk;
    d.innerHTML =
      '<div class="view">' +
      '<h1 class="desk-h">The shared shell</h1>' +
      '<p class="desk-p">Everything above the wood is the shell: the top bar with the player chip, music and sound, and Inspector Cāsus in his brass frame.</p>' +

      '<section class="card tabbed demo-sec" aria-labelledby="dhBub"><span class="card-tab">Inspector</span><h2 id="dhBub">His bubble and his moods</h2>' +
      '<div class="demo-row"><button type="button" class="btn primary" data-a="lines">Three lines</button><button type="button" class="btn wood" data-a="one">One line</button></div>' +
      '<div class="demo-moods" role="group" aria-label="Moods"></div></section>' +

      '<section class="card tabbed demo-sec" aria-labelledby="dhBtn"><span class="card-tab">Buttons</span><h2 id="dhBtn">Every button style</h2>' +
      '<div class="demo-row"><button type="button" class="btn primary">Primary</button><button type="button" class="btn wood">Wood</button></div>' +
      '<div class="demo-row"><button type="button" class="btn ghost">Ghost</button><button type="button" class="btn danger">Danger</button></div>' +
      '<div class="demo-row"><button type="button" class="btn primary sm">Small</button><button type="button" class="btn wood sm">Small wood</button><button type="button" class="btn primary" disabled>Disabled</button></div>' +
      '<p>On parchment a <button type="button" class="tlink">text link</button> takes ink. <span class="chip red">chip</span> <span class="chip latin" lang="la">porta</span> <span class="stamp">Stamp</span></p></section>' +

      '<div class="demo-row"><button type="button" class="btn primary">Primary on wood</button><button type="button" class="btn wood">Wood on wood</button><button type="button" class="btn ghost">Ghost on wood</button><button type="button" class="btn danger">Danger</button></div>' +

      '<section class="card tabbed demo-sec" aria-labelledby="dhLa"><span class="card-tab">Typing Latin</span><h2 id="dhLa">Macron keys and the checker</h2>' +
      '<p class="demo-q">Type the Latin for <b>fame, rumor, reputation</b>:</p>' +
      '<div class="demo-mode" role="group" aria-label="Macrons"><button type="button" class="btn wood sm" data-m="ignored" aria-pressed="false">Ignored</button><button type="button" class="btn wood sm" data-m="light" aria-pressed="true">Light</button><button type="button" class="btn wood sm" data-m="strict" aria-pressed="false">Strict</button></div>' +
      '<form class="demo-form" novalidate><label class="sr" for="demoIn">Your answer</label><input id="demoIn" type="text" placeholder="fāma" maxlength="40">' +
      '<div class="demo-row" style="margin-top:10px"><button type="submit" class="btn primary">Check</button></div></form>' +
      '<p class="demo-res" id="demoRes" aria-live="polite"></p><p class="lpf-hint">Tip: a vowel followed by - or = turns long: <b>a-</b> gives <b lang="la">ā</b>.</p></section>' +

      '<section class="card tabbed demo-sec" aria-labelledby="dhDlg"><span class="card-tab">Dialogs</span><h2 id="dhDlg">Dialogs, sheets and toasts</h2>' +
      '<div class="demo-row"><button type="button" class="btn wood" data-a="dialog">Dialog</button><button type="button" class="btn wood" data-a="sheet">Sheet</button><button type="button" class="btn wood" data-a="toast">Toast</button></div></section>' +

      '<section class="card tabbed demo-sec" aria-labelledby="dhSt"><span class="card-tab">Storage</span><h2 id="dhSt">What the browser keeps</h2>' +
      '<p>Playing as: <b id="demoWho"></b></p>' +
      '<div class="demo-row"><button type="button" class="btn wood sm" data-a="save">Save a test score</button><button type="button" class="btn wood sm" data-a="refresh">Refresh</button></div>' +
      '<pre class="demo-pre" id="demoStore"></pre></section>' +
      '<div class="dock"><a class="tlink" href="sources.html">For parents: where the words and charts come from</a></div>' +
      "</div>";

    var moods = (window.Detective && window.Detective.MOODS) || ["idle", "wave", "think", "search", "point", "cheer", "oops", "proud"];
    var mb = d.querySelector(".demo-moods");
    moods.forEach(function (m) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn wood sm"; b.textContent = m;
      b.addEventListener("click", function () { shell.act(m, 1800); });
      mb.appendChild(b);
    });
    on("lines", function () { shell.say(["<b>Salvē!</b> One idea a line.", "The arrow brings the <i>next</i> line.", "This is the last one: no arrow now."], ["wave", "point", "!cheer"]); });
    on("one", function () { shell.say("Just one line, so no arrow.", "think"); });
    on("dialog", function () {
      shell.dialog({ title: "Leave tonight's round?", text: "Your words keep the offices they have climbed to.", alert: true,
        buttons: [{ label: "Keep playing", kind: "primary", value: false }, { label: "Leave", kind: "danger", value: true }] })
        .then(function (v) { shell.toast(v ? "You left (demo)." : "Kept playing.", { kind: v ? "bad" : "good" }); });
    });
    on("sheet", function () {
      shell.dialog({ title: "Settings", sheet: true, html: "<p>A sheet rises from the bottom. Settings and lists go here.</p>", buttons: [{ label: "Done", kind: "primary", value: "done" }] });
    });
    on("toast", function () { shell.toast("<b>Quaestor!</b> <i>fāma</i> climbed one office.", { kind: "good" }); S.sfx("star"); });
    on("save", function () {
      var pl = shell.player(); if (!pl) { return; }
      var o = progress.load(pl.id) || { tries: 0 };
      o.tries++; o.day = S.today();
      progress.save(pl.id, o);
      showStore();
    });
    on("refresh", showStore);

    /* the macron input */
    var mode = "light", inp = d.querySelector("#demoIn"), res = d.querySelector("#demoRes");
    S.macronKeys(inp);
    Array.prototype.forEach.call(d.querySelectorAll("[data-m]"), function (b) {
      b.addEventListener("click", function () {
        mode = b.getAttribute("data-m");
        Array.prototype.forEach.call(d.querySelectorAll("[data-m]"), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      });
    });
    d.querySelector(".demo-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var r = S.check(inp.value, ["fāma"], mode);
      inp.classList.toggle("ok", r.ok); inp.classList.toggle("no", !r.ok);
      if (!r.ok) { inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); }
      res.innerHTML = r.ok ? (r.slip ? "Right! Mind the macrons: <i lang=\"la\">" + S.esc(r.answer) + "</i>" : "Right!") : (r.slip ? "Only the macrons are off: <i lang=\"la\">" + S.esc(r.answer) + "</i>" : "Not yet. It is <i lang=\"la\">" + S.esc(r.answer) + "</i>");
      shell.act(r.ok ? "cheer" : "oops", 1600);
      S.sfx(r.ok ? "correct" : "wrong");
    });
    showStore();
  }
  function on(a, fn) { var b = shell.desk.querySelector('[data-a="' + a + '"]'); if (b) { b.addEventListener("click", fn); } }
  function showStore() {
    var who = shell.desk.querySelector("#demoWho"), pre = shell.desk.querySelector("#demoStore"), p = shell.player();
    if (who) { who.textContent = p ? p.name + " · " + LatinPlayers.gradeLine(p, true) : "nobody"; }
    if (!pre) { return; }
    var a = null, b = null;
    try { a = localStorage.getItem(LatinPlayers.KEY); b = localStorage.getItem("latinDemo.v1"); } catch (e) { a = "(no localStorage here)"; }
    pre.textContent = LatinPlayers.KEY + " = " + a + "\n\nlatinDemo.v1 = " + b;
  }
  function settings() {
    var s = S.settings(), wrap = document.createElement("div");
    wrap.innerHTML = '<p>These follow the shared settings of every Latin game.</p><div class="demo-row" style="margin-top:10px">' +
      '<button type="button" class="btn wood" data-s="sound">Sound effects: ' + (s.sound ? "on" : "off") + '</button><button type="button" class="btn wood" data-s="music">Music: ' + (s.music ? "on" : "off") + "</button></div>";
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-s]"), function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-s"), v = !S.settings()[k];
        S.set(k, v);
        b.textContent = (k === "sound" ? "Sound effects: " : "Music: ") + (v ? "on" : "off");
      });
    });
    shell.dialog({ title: "Settings", sheet: true, el: wrap, buttons: [{ label: "Done", kind: "primary" }] });
  }
  LatinPlayers.onchange(showStore);
})();
</script>
</body>
</html>

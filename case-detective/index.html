<div class="floor" aria-hidden="true"></div>

<div class="app" id="app" data-view="home">

  <header class="topbar" id="topbar">
    <button type="button" class="tb-btn tb-home" id="homeBtn" data-action="home" aria-label="Back to the case files" hidden>
      <svg class="ic" aria-hidden="true"><use href="#i-files"></use></svg><span class="tb-lab">Case files</span>
    </button>
    <div class="logo" id="logo"><svg class="ic" aria-hidden="true"><use href="#i-glass"></use></svg><span>Case Detective</span></div>
    <div class="tb-mid" id="tbMid"></div>
    <div class="streak" id="streak" hidden><svg class="ic" aria-hidden="true"><use href="#i-flame"></use></svg><b id="streakN">0</b><span class="sr">answers in a row</span></div>
    <button type="button" class="tb-btn" id="nbBtn" data-action="notebook" aria-haspopup="dialog" aria-label="Open the Notebook">
      <svg class="ic" aria-hidden="true"><use href="#i-book"></use></svg><span class="tb-lab">Notebook</span>
    </button>
    <button type="button" class="tb-btn tb-sound" id="soundBtn" data-action="sound" aria-pressed="true" aria-label="Sound">
      <svg class="ic ic-on" aria-hidden="true"><use href="#i-sound"></use></svg><svg class="ic ic-off" aria-hidden="true"><use href="#i-mute"></use></svg>
    </button>
  </header>

  <section class="stage" id="stage" aria-label="The Inspector">
    <div class="window" id="window" aria-hidden="true">
      <div class="sky"></div>
      <svg class="sky-stars" viewBox="0 0 400 300" preserveAspectRatio="xMidYMin slice" focusable="false">
        <g fill="#eef4ff">
          <circle cx="22" cy="24" r="1.300"/><circle cx="58" cy="60" r=".9"/><circle cx="84" cy="18" r="1.100"/><circle cx="118" cy="44" r="1.400" class="tw t1"/><circle cx="150" cy="14" r=".9"/><circle cx="176" cy="70" r="1"/>
          <circle cx="208" cy="30" r="1.500" class="tw t2"/><circle cx="238" cy="56" r=".9"/><circle cx="262" cy="16" r="1.100"/><circle cx="292" cy="42" r="1.300"/><circle cx="318" cy="76" r=".9"/><circle cx="342" cy="22" r="1.500" class="tw t3"/>
          <circle cx="372" cy="54" r="1"/><circle cx="388" cy="18" r=".8"/><circle cx="36" cy="98" r="1"/><circle cx="98" cy="112" r="1.200" class="tw t2"/><circle cx="140" cy="92" r=".8"/><circle cx="226" cy="104" r="1.100"/>
          <circle cx="276" cy="92" r=".9"/><circle cx="334" cy="118" r="1.200" class="tw t1"/><circle cx="380" cy="100" r=".9"/><circle cx="60" cy="150" r=".9"/><circle cx="190" cy="140" r="1"/><circle cx="300" cy="156" r="1"/><circle cx="12" cy="130" r=".8"/><circle cx="356" cy="168" r=".8"/>
        </g>
      </svg>
      <svg class="moon" viewBox="0 0 40 40" focusable="false"><circle cx="20" cy="20" r="19" fill="#cfe0ff" opacity=".14"/><path d="M27,5.500A15,15 0 1 0 34.500,27A12,12 0 0 1 27,5.500Z" fill="#f2f6ff"/></svg>
      <svg class="skyline sk-a" viewBox="0 0 800 200" preserveAspectRatio="xMidYMax slice" focusable="false"><use href="#sk-far"></use></svg>
      <svg class="skyline sk-b" viewBox="0 0 800 200" preserveAspectRatio="xMidYMax slice" focusable="false"><use href="#sk-near"></use><use href="#sk-lights"></use></svg>
      <div class="frame"></div>
    </div>
    <div class="insp" id="insp"><div class="insp-glow"></div><div class="insp-fig" id="inspFig"></div></div>
    <div class="bubble-wrap" id="bubbleWrap">
      <div class="bubble" id="bubble">
        <span class="b-name" id="bName" aria-hidden="true"></span>
        <div class="b-text" id="bText"></div>
        <button type="button" class="b-next" id="bNext" hidden aria-label="Next line"><svg class="ic" aria-hidden="true"><use href="#i-next"></use></svg></button>
      </div>
    </div>
  </section>

  <main class="desk" id="desk" tabindex="-1"></main>
</div>

<!-- the Notebook: first dialog in the document on purpose -->
<div class="scrim" id="nbScrim" hidden></div>
<section class="nb" id="notebook" role="dialog" aria-modal="true" aria-labelledby="nbTitle" aria-hidden="true">
  <div class="nb-cover">
    <header class="nb-head">
      <h2 id="nbTitle">Detective Notebook</h2>
      <button type="button" class="nb-close" id="nbClose" aria-label="Close the Notebook"><svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg></button>
    </header>
    <div class="nb-pages" id="nbPages" tabindex="-1"></div>
  </div>
</section>

<div class="scrim" id="cfScrim" hidden></div>
<section class="confirm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle" aria-describedby="cfText" aria-hidden="true">
  <h2 id="cfTitle">Erase your progress?</h2>
  <p id="cfText">Every star, ribbon and rank will be wiped from this device. The case files stay.</p>
  <div class="cf-row">
    <button type="button" class="btn primary" id="cfNo">Keep my stars</button>
    <button type="button" class="btn danger" id="cfYes">Erase everything</button>
  </div>
</section>

<div class="fx" id="fx" aria-hidden="true"></div>
<div class="sr" id="live" aria-live="polite" aria-atomic="true"></div>
<noscript><p class="noscript">Case Detective needs JavaScript to run. Please turn it on and reload.</p></noscript>

<script src="js/data.js"></script>
<script src="js/detective.js"></script>
<script src="js/sfx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
